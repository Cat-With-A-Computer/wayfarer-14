#region Laser bolts
# Pistols / SMGs
- type: entity
  id: NFBulletLaserLow
  parent: NFBaseBulletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 10

# Assault Rifles / Carbines
- type: entity
  id: NFBulletLaserPractice
  parent: NFBaseBulletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser_greyscale
      shader: unshaded
      color: green
  - type: Projectile
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 0

- type: entity
  id: NFBulletLaserMedium
  parent: NFBaseBulletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 15

- type: entity
  id: NFBulletLaserRepeater
  parent: NFBaseBulletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 12.5

# Rifles
- type: entity
  id: NFBulletLaserHeavy
  parent: NFBaseBulletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 17.5

# Pellets        
- type: entity
  id: WFBulletLaserShotgunPellet
  parent: BulletEnergyGunMagnum
  categories: [ HideSpawnMenu ]
  name: pellet (laser)
  components:
  - type: Projectile
    damage:
      types:
        Heat: 5.5

- type: entity
  id: WFBulletLaserShotgunPelletDisabler
  parent: BulletDisabler
  categories: [ HideSpawnMenu ]
  name: pellet (disabler)
  components:
  - type: Projectile
    damage:
      types:
        Shock: 1
    soundHit:
      collection: WeakHit
    forceSound: true
  - type: StaminaDamageOnCollide
    damage: 7.5

# PelletsSpread
- type: entity
  id: WFBulletLaserShotgunWide
  name: Wide Spread
  parent: WFBulletLaserShotgunPellet
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: WFBulletLaserShotgunPellet
    count: 9
    spread: 30
    impactEffect: BulletImpactEffectOrangeDisabler

- type: entity
  id: WFBulletLaserShotgunNarrow
  name: Narrow Spread
  parent: WFBulletLaserShotgunPellet
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: WFBulletLaserShotgunPellet
    count: 7
    spread: 10
    impactEffect: BulletImpactEffectOrangeDisabler
        
- type: entity
  id: WFBulletDisablerShotgun
  name: Disabler Spread
  parent: WFBulletLaserShotgunPelletDisabler
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: WFBulletLaserShotgunPelletDisabler
    count: 5
    spread: 9.5
    impactEffect: BulletImpactEffectDisabler

#region Disabler bolts
- type: entity
  parent: BulletDisabler
  id: NFBulletDisablerStaminaOnly
  name: disabler bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Shock: 0
    soundHit:
      collection: WeakHit
    forceSound: true

- type: entity
  id: NFBulletDisabler
  name: disabler bolt
  parent: BulletDisabler
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Shock: 2
    soundHit:
      collection: WeakHit
    forceSound: true
  - type: StaminaDamageOnCollide
    damage: 18

- type: entity
  id: NFBulletDisablerLow
  name: disabler bolt
  parent: BulletDisabler
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Shock: 1
    soundHit:
      collection: WeakHit
    forceSound: true
  - type: StaminaDamageOnCollide
    damage: 14

#region Kinetic bolts
- type: entity
  id: NFBulletKineticLowPower
  name: kinetic bolt
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 12.5
        Structural: 30
  - type: Ammo
    muzzleFlash: HitscanEffect
  - type: TimedDespawn
    lifetime: 1.5
  - type: PointLight
    radius: 2.5
    color: white
    energy: 0.5
  - type: GatheringProjectile
  - type: MiningGatheringSoft

- type: entity
  id: NFBulletKineticMediumPower
  name: kinetic bolt
  parent: NFBulletKineticLowPower
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 16.25
        Structural: 30

- type: entity
  id: NFBulletKineticHighPower
  name: kinetic bolt
  parent: NFBulletKineticLowPower
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: chronobolt
      shader: unshaded
      color: "#ffffff"
      scale: 1.2,1.2
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 22.5
        Structural: 35 #Wayfarer 30 -> 35
  - type: PointLight
    color: "#ffffff"
  - type: MiningGatheringHard
